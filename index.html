<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uma mensagem para você · ACAMPs 2027</title>
<meta name="description" content="Receba uma mensagem da Palavra de Deus pensada para você. Comunidade Católica Shalom de Santos · ACAMPs 2027.">
<meta name="theme-color" content="#FF7C26">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/facivon.png">
<link rel="apple-touch-icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Montserrat:wght@700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="fundo" aria-hidden="true"></canvas>
<div class="sol" aria-hidden="true"></div><div class="bola b1" aria-hidden="true"></div><div class="bola b2" aria-hidden="true"></div>

<main>
  <!-- TELA INICIAL -->
  <section id="inicio" class="tela ativa" aria-label="Início">
    
    <h1>Deus tem uma palavra para você</h1>
    <p class="sub">Toque no botão e receba uma mensagem da Bíblia.</p>
    <button class="btn grande" id="btnReceber" type="button">Receber uma mensagem para mim</button>
  </section>

  <!-- TELA DA MENSAGEM -->
  <section id="mensagem" class="tela" aria-label="Sua mensagem" aria-live="polite">
    <article class="cartao" id="cartao">
      <p class="versiculo" id="versiculo"></p>
      <span class="ref" id="ref"></span>
      <p class="frase" id="frase"></p>
    </article>

    <div class="acoes">
      <button class="btn" id="btnOutra" type="button">Sortear outra mensagem</button>
      <button class="link" id="btnVoltar" type="button">Voltar ao início</button>
    </div>

    <aside class="acamps" aria-label="ACAMPs 2027">
      <p>Talvez Deus esteja te convidando para viver algo novo. Permita-se conhecer esse encontro!</p>
      <div class="nome">ACAMPs 2027</div>
      <!-- Botão "Mais Informações": troque o href pelo link oficial (inscrição, página do evento, Instagram...). -->

      <a href="https://www.e-inscricao.com/comunidade-catlica-shalom/acampssp27" target="_self" rel="" class="custom-button" id="infoEvento" aria-label="https://www.e-inscricao.com/comunidade-catlica-shalom/acampssp27"> 

        <img src="https://www.pngkey.com/png/full/375-3752806_publicaes-mais-antigas-logo-comunidade-catolica-shalom.png" alt="" aria-hidden="true" style="width: 20px; height: 20px;" onerror="this.style.display='none'">
        Mais Informações
        
      </a>

    </aside>
  </section>
</main>

<footer>
  <strong>Comunidade Católica Shalom Santos</strong>
  <a href="https://www.instagram.com/shalomsantos/" target="_blank" rel="noopener noreferrer">@comunidadeshalomsantos</a>
</footer>




<script src="js/mensagens.js"></script>
<script src="js/fundo-imagem.js"></script>
<script src="js/app.js"></script>
<script src="js/fundo.js"></script>
<script src="js/musica.js"></script>
</body>
</html>
